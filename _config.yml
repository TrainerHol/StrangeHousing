# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.
#
# If you need help with YAML syntax, here are some quick references for you:
# https://learn-the-web.algonquindesign.ca/topics/markdown-yaml-cheat-sheet/#yaml
# https://learnxinyminutes.com/docs/yaml/
#
# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.

title: STRANGE HOUSING - FF14 Parkour
email: your-email@example.com
description: >- # this means to ignore newlines until "baseurl:"
  Strange Housing is a FF14 Parkour community focusing on building and sharing jump puzzles.
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://www.xivpuzzles.com" # the base hostname & protocol for your site, e.g. http://example.com
twitter_username: TrainerHol
github_username: TrainerHol
logo: "/assets/images/strangehousinglogo.png"
# Aux links for the upper right navigation
aux_links:
  "SH Discord":
    - "https://discord.gg/TGVVMx6wA6"

# Makes Aux links open in a new tab. Default is false
aux_links_new_tab: true
color_scheme: dark

# Build settings
remote_theme: just-the-docs/just-the-docs
theme: null # Disable the theme gem
search_enabled: true
languages: ["en", "ja"]
default_lang: "en"
exclude_from_localization: ["assets", "images", "css", "js", "fonts", ".obsidian"]
parallel_localization: true
plugins:
  - jekyll-feed
  - jekyll-multiple-languages-plugin

# Collections configuration
collections:
  docs:
    permalink: "/:collection/:path/"
    output: true

defaults:
  - scope:
      path: ""
      type: docs
    values:
      layout: translated_page
      translate: true

# Just the Docs configuration
just_the_docs:
  collections:
    docs:
      name: Guides

callouts:
  warning:
    title: Warning
    color: red
  info:
    title: Info
    color: green
